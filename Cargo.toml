[package]
name = "lora-boite-lettres"
version = "0.1.0"
authors = ["Phil-dav"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1" }
esp-idf-hal = { version = "0.46.2" }
anyhow = "1.0.104"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
heapless = "0.9.3"

[build-dependencies]
embuild = "0.33"
